version: "3.8"

services:
  zookeeper:
    image: cve-free/zookeeper:7.6.0
    container_name: cve-free-zookeeper
    ports:
      - "2181:2181"
      - "2888:2888"
      - "3888:3888"
    environment:
      CP_VERSION: 7.6.0
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_DATA_DIR: /var/lib/zookeeper/data
      ZOOKEEPER_DATA_LOG_DIR: /var/lib/zookeeper/log
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_SERVERS: zookeeper:2888:3888
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "echo", "srvr", "|", "nc", "-w", "2", "localhost", "2181"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cve-free-network

  kafka:
    image: cve-free/cp-kafka:7.6.0
    container_name: cve-free-kafka
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      CP_VERSION: 7.6.0
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_JMX_PORT: 9101
      KAFKA_HEAP_OPTS: "-Xms1g -Xmx1g"
      KAFKA_PERFORMANCE_JVM_OPTS: "-server -XX:+UseG1GC -XX:MaxGCPauseMillis=20"
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - cve-free-network

  schema-registry:
    image: cve-free/schema-registry:7.6.0
    container_name: cve-free-schema-registry
    ports:
      - "8081:8081"
    environment:
      CP_VERSION: 7.6.0
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
      SCHEMA_REGISTRY_KAFKASTORE_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_DEBUG: "false"
      SCHEMA_REGISTRY_MAX_CONNECTIONS: 100
      SCHEMA_REGISTRY_MIN_INSYNC_REPLICAS: 1
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xms1g -Xmx1g"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/subjects"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - cve-free-network

  elasticsearch:
    image: cve-free/elasticsearch:8.15.0
    container_name: cve-free-elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      ELASTICSEARCH_VERSION: 8.15.0
      ELASTICSEARCH_HOME: /elasticsearch
      PATH: /elasticsearch/bin:${PATH}
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      cluster.name: cve-free-es
      discovery.type: single-node
      http.port: 9200
      transport.port: 9300
      path.data: /data/elasticsearch
      path.logs: /var/log/elasticsearch
    volumes:
      - es_data:/data/elasticsearch
      - es_logs:/var/log/elasticsearch
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - cve-free-network

  mongodb:
    image: cve-free/mongodb:8.3.13
    container_name: cve-free-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGODB_VERSION: 8.3.13
      PATH: /mongodb/bin:${PATH}
      HOME: /data/db
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cve-free-network

  datahub-gms:
    image: cve-free/datahub-gms:1.7.0.1
    container_name: cve-free-datahub-gms
    ports:
      - "8080:8080"
      - "4319:4319"
    environment:
      DATAHUB_VERSION: 1.7.0.1
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 4319
      KAFKA_BOOTSTRAP_SERVER: kafka:9092
      KAFKA_CONSUMER_GROUP_ID: datahub-gms
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_PROTOCOL: http
      ELASTICSEARCH_ENABLED: "true"
      ENTITY_SERVICE_IMPL: ebean
      EBEAN_DATASOURCE_HOST: mysql
      EBEAN_DATASOURCE_PORT: 3306
      GRAPH_SERVICE_IMPL: elasticsearch
      NEO4J_HOST: neo4j
      KAFKA_SCHEMAREGISTRY_URL: http://schema-registry:8081
      SKIP_KAFKA_CHECK: "false"
      SKIP_SCHEMA_REGISTRY_CHECK: "false"
      SKIP_NEO4J_CHECK: "false"
      SKIP_EBEAN_CHECK: "false"
      SKIP_CASSANDRA_CHECK: "false"
      ENABLE_OTEL: "false"
      ENABLE_PROMETHEUS: "false"
      JAVA_OPTS: "-Xms1g -Xmx2g"
      JAVA_TOOL_OPTIONS: ""
      DATAHUB_GMS_BASE_PATH: /
    depends_on:
      zookeeper:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - cve-free-network

  datahub-mae-consumer:
    image: cve-free/datahub-mae-consumer:1.7.0.1
    container_name: cve-free-datahub-mae-consumer
    environment:
      DATAHUB_VERSION: 1.7.0.1
      SERVER_PORT: 9090
      MANAGEMENT_SERVER_PORT: 4319
      KAFKA_BOOTSTRAP_SERVER: kafka:9092
      KAFKA_CONSUMER_GROUP_ID: datahub-mae-consumer
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_PROTOCOL: http
      ELASTICSEARCH_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URL: http://schema-registry:8081
      SKIP_KAFKA_CHECK: "false"
      SKIP_SCHEMA_REGISTRY_CHECK: "false"
      ENABLE_OTEL: "false"
      ENABLE_PROMETHEUS: "false"
      JAVA_OPTS: "-Xms512m -Xmx1g"
      JAVA_TOOL_OPTIONS: ""
    depends_on:
      zookeeper:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      datahub-gms:
        condition: service_healthy
    networks:
      - cve-free-network

  datahub-mce-consumer:
    image: cve-free/datahub-mce-consumer:1.7.0.1
    container_name: cve-free-datahub-mce-consumer
    environment:
      DATAHUB_VERSION: 1.7.0.1
      SERVER_PORT: 9090
      MANAGEMENT_SERVER_PORT: 4319
      KAFKA_BOOTSTRAP_SERVER: kafka:9092
      KAFKA_CONSUMER_GROUP_ID: datahub-mce-consumer
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_PROTOCOL: http
      ELASTICSEARCH_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URL: http://schema-registry:8081
      SKIP_KAFKA_CHECK: "false"
      SKIP_SCHEMA_REGISTRY_CHECK: "false"
      ENABLE_OTEL: "false"
      ENABLE_PROMETHEUS: "false"
      JAVA_OPTS: "-Xms512m -Xmx1g"
      JAVA_TOOL_OPTIONS: ""
    depends_on:
      zookeeper:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      datahub-gms:
        condition: service_healthy
    networks:
      - cve-free-network

  datahub-frontend-react:
    image: cve-free/datahub-frontend-react:1.7.0.1
    container_name: cve-free-datahub-frontend-react
    ports:
      - "9002:9002"
      - "4319:4319"
    environment:
      DATAHUB_VERSION: 1.7.0.1
      SERVER_PORT: 9002
      MANAGEMENT_SERVER_PORT: 4319
      MFE_CONFIG_FILE_PATH: /datahub-frontend/conf/mfe.config.dev.yaml
      JAVA_MEMORY_OPTS: "-Xms512m -Xmx1024m"
      ENABLE_OTEL: "false"
      ENABLE_PROMETHEUS: "false"
      JAVA_TOOL_OPTIONS: ""
    depends_on:
      datahub-gms:
        condition: service_healthy
    networks:
      - cve-free-network

  datahub-actions:
    image: cve-free/datahub-actions:1.7.0.1
    container_name: cve-free-datahub-actions
    environment:
      DATAHUB_VERSION: 1.7.0.1
      DATAHUB_GMS_PROTOCOL: http
      DATAHUB_GMS_HOST: datahub-gms
      DATAHUB_GMS_PORT: 8080
      DATAHUB_GMS_STARTUP_TIMEOUT_SEC: 240
      DATAHUB_ACTIONS_SYSTEM_CONFIGS_PATH: /etc/datahub/actions/system/conf
      DATAHUB_ACTIONS_USER_CONFIGS_PATH: /etc/datahub/actions/conf
      DATAHUB_ACTIONS_MONITORING_ENABLED: "false"
      DATAHUB_ACTIONS_MONITORING_PORT: 8000
    depends_on:
      datahub-gms:
        condition: service_healthy
    networks:
      - cve-free-network

  datahub-upgrade:
    image: cve-free/datahub-upgrade:1.7.0.1
    container_name: cve-free-datahub-upgrade
    environment:
      DATAHUB_VERSION: 1.7.0.1
      SPRING_PROFILES_ACTIVE: upgrade
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 4319
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_PROTOCOL: http
      ELASTICSEARCH_USE_SSL: "false"
      NEO4J_HOST: neo4j
      ENTITY_SERVICE_IMPL: ebean
      EBEAN_DATASOURCE_HOST: mysql
      GRAPH_SERVICE_IMPL: elasticsearch
      SKIP_ELASTICSEARCH_CHECK: "false"
      SKIP_EBEAN_CHECK: "false"
      SKIP_NEO4J_CHECK: "false"
      ENABLE_OTEL: "false"
      ENABLE_PROMETHEUS: "false"
      JAVA_OPTS: ""
      JAVA_TOOL_OPTIONS: ""
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - cve-free-network

networks:
  cve-free-network:
    driver: bridge

volumes:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  es_data:
  es_logs:
  mongodb_data:
