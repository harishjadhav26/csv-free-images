# DataHub with standalone MAE/MCE consumers + external Schema Registry
# Uses CVE-free DataHub images + official confluentinc/cp-schema-registry (retagged cve-free)
# Infra (kafka/opensearch/mysql) from docker-compose.run.yml (dh-* services)
name: datahub-cvefree-consumers

services:
  schema-registry:
    image: harishjadhav26/cve-free-schema-registry:7.9.11
    hostname: schema-registry
    container_name: dh-schema-registry
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: broker:29092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
      SCHEMA_REGISTRY_KAFKASTORE_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_DEBUG: "false"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - datahub-run

  datahub-mae-consumer:
    image: cve-free/datahub-mae-consumer:v1.7.0.1-cvefree
    hostname: datahub-mae-consumer
    container_name: dh-mae-consumer
    depends_on:
      schema-registry:
        condition: service_healthy
    environment:
      DATAHUB_SERVER_TYPE: quickstart
      ENTITY_REGISTRY_CONFIG_PATH: /datahub/datahub-mae-consumer/resources/entity-registry.yml
      DATAHUB_SYSTEM_CLIENT_SECRET: JohnSnowKnowsNothing
      DATAHUB_TOKEN_SERVICE_SIGNING_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DATAHUB_TOKEN_SERVICE_SALT: 0123456789abcdef0123456789abcdef
      EBEAN_DATASOURCE_DRIVER: com.mysql.jdbc.Driver
      EBEAN_DATASOURCE_HOST: mysql:3306
      EBEAN_DATASOURCE_PASSWORD: datahub
      EBEAN_DATASOURCE_URL: jdbc:mysql://mysql:3306/datahub?verifyServerCertificate=false&useSSL=true&useUnicode=yes&characterEncoding=UTF-8&rewriteBatchedStatements=true&enabledTLSProtocols=TLSv1.2
      EBEAN_DATASOURCE_USERNAME: root
      KAFKA_BOOTSTRAP_SERVER: broker:29092
      KAFKA_CONSUMER_GROUP_ID: datahub-mae-consumer
      ELASTICSEARCH_HOST: search
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_PROTOCOL: http
      ELASTICSEARCH_USE_SSL: 'false'
      KAFKA_SCHEMAREGISTRY_URL: http://schema-registry:8081
      SKIP_KAFKA_CHECK: "false"
      SKIP_SCHEMA_REGISTRY_CHECK: "false"
      SERVER_PORT: 9090
      MANAGEMENT_SERVER_PORT: 4319
      JAVA_OPTS: -Xms512m -Xmx1g
    networks:
      - datahub-run

  datahub-mce-consumer:
    image: cve-free/datahub-mce-consumer:v1.7.0.1-cvefree
    hostname: datahub-mce-consumer
    container_name: dh-mce-consumer
    depends_on:
      schema-registry:
        condition: service_healthy
    environment:
      DATAHUB_SERVER_TYPE: quickstart
      ENTITY_REGISTRY_CONFIG_PATH: /datahub/datahub-mce-consumer/resources/entity-registry.yml
      DATAHUB_SYSTEM_CLIENT_SECRET: JohnSnowKnowsNothing
      DATAHUB_TOKEN_SERVICE_SIGNING_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DATAHUB_TOKEN_SERVICE_SALT: 0123456789abcdef0123456789abcdef
      EBEAN_DATASOURCE_DRIVER: com.mysql.jdbc.Driver
      EBEAN_DATASOURCE_HOST: mysql:3306
      EBEAN_DATASOURCE_PASSWORD: datahub
      EBEAN_DATASOURCE_URL: jdbc:mysql://mysql:3306/datahub?verifyServerCertificate=false&useSSL=true&useUnicode=yes&characterEncoding=UTF-8&rewriteBatchedStatements=true&enabledTLSProtocols=TLSv1.2
      EBEAN_DATASOURCE_USERNAME: root
      KAFKA_BOOTSTRAP_SERVER: broker:29092
      KAFKA_CONSUMER_GROUP_ID: datahub-mce-consumer
      ELASTICSEARCH_HOST: search
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_PROTOCOL: http
      ELASTICSEARCH_USE_SSL: 'false'
      KAFKA_SCHEMAREGISTRY_URL: http://schema-registry:8081
      SKIP_KAFKA_CHECK: "false"
      SKIP_SCHEMA_REGISTRY_CHECK: "false"
      SERVER_PORT: 9090
      MANAGEMENT_SERVER_PORT: 4319
      JAVA_OPTS: -Xms512m -Xmx1g
    networks:
      - datahub-run

networks:
  datahub-run:
    name: datahub-run_default
    external: true